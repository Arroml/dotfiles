########## PLUGINS ##########
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'
set -g @plugin 'omerxx/tmux-sessionx'

########## GENERAL ##########
set -g automatic-rename on
set -g allow-rename off



set -g base-index 1
setw -g pane-base-index 1
set -g mode-keys vi
set -g mouse on
# alten Prefix entfernen
# Copy to system# alten Prefix entfernen
unbind C-b

# Prefix on Ctrl-a so Command/Option bindings stay free for direct actions.
set -g prefix C-a
bind C-a send-prefix
# Copy to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Neues Fenster im aktuellen Verzeichnis öffnen
bind c new-window -c "#{pane_current_path}"

# New sessions start with five standard windows so a/s/d/f/g are always available.
set-hook -g after-new-session "run-shell '$HOME/dotfiles/.config/tmux/scripts/bootstrap_session_windows.sh #{socket_path} #{session_name}'"
########## SESSIONX SETTINGS ##########
set -g @sessionx-prefix 'off'
set -g @sessionx-bind 'C-M-o'
# Prefix auf Ctrl-a setzen
set -g prefix C-a
bind C-a send-prefix
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Neues Fenster im aktuellen Verzeichnis öffnen
bind c new-window -c "#{pane_current_path}"
########## WINDOW SWITCHING (MIT PREFIX) ##########

# Fenster 1–5 direkt

########## SESSIONX SETTINGS ##########
set -g @sessionx-bind 'k'
set -g @sessionx-x-path "$HOME/dotfiles"
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'

# Bindings # 
bind -n C-M-a select-window -t 1
bind -n C-M-s select-window -t 2
bind -n C-M-d select-window -t 3
bind -n C-M-f select-window -t 4
bind -n C-M-g select-window -t 5
bind -n C-M-k select-window -t 5
bind -n C-M-h select-window -t 6
bind -n C-M-j select-window -t 7
bind -n C-M-l switch-client -l
bind -n C-M-k run-shell "~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh"
bind -n C-M-r command-prompt -I "#W" "rename-window '%%'"
bind -n C-M-t new-window -c "#{pane_current_path}"
bind -n C-M-y display-popup -E -x 0 -y 0 -w 100% -h 100% \

# tmux copy mode (vi)
set -g mode-keys vi
bind -n C-M-y copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Zeichenweise Auswahl (wie Vim: v)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Zeilenweise Auswahl (V)
bind-key -T copy-mode-vi V send-keys -X select-line

# Blockweise Auswahl (Ctrl-v)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Kopieren + Copy-Mode verlassen
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Optional: Escape / q beendet Copy-Mode
bind-key -T copy-mode-vi q send-keys -X cancel

##### WORD / BLOCK SELECTION (vi-like) #####

# Inner WORD (großes Wort, Whitespace-getrennt)
bind-key -T copy-mode-vi i send-keys -X select-word
bind-key -T copy-mode-vi W send-keys -X select-word


# Navigation zwischen Splits mit Ctrl+h / Ctrl+l
bind -n C-h select-pane -L
bind -n C-l select-pane -R

# Optional auch oben/unten
bind -n C-k select-pane -U
bind -n C-j select-pane -D



########## COLORS (Gruvbox Dark Soft) ##########
set -g status-position top

bg="#282828"
default_fg="#ebdbb2"

session_fg="#fabd2f"
session_selection_fg="#282828"
session_selection_bg="#d79921"

active_window_fg="#fabd2f"
active_pane_border="#d79921"
inactive_pane_border="#504945"

status_bg="#3c3836"
status_fg="#ebdbb2"

########## STATUS BAR ##########

set -g status-style "bg=${bg},fg=${default_fg}"
set -g status-left "#[fg=${session_fg},bold,bg=${bg}] #S #[fg=${default_fg},nobold,bg=${bg}] | "
set -g status-right " #{cpu -i 3}   #{mem}"

# --- Window index -> a s d f g mapping ---
set -g window-status-format "#[fg=${default_fg},bg=default] \
#{?#{==:#{window_index},1},a,\
#{?#{==:#{window_index},2},s,\
#{?#{==:#{window_index},3},d,\
#{?#{==:#{window_index},4},f,\
#{?#{==:#{window_index},5},g,\
#{?#{==:#{window_index},6},h,\
#{?#{==:#{window_index},7},j,\
#{window_index}}}}}}}} :#{pane_current_command}"
set -g window-status-current-format "#[fg=${active_window_fg},bold,bg=default]  #[underscore]\
#{window_index}}}}}}}} :#{window_name}"

set -g window-status-current-format "#[fg=${active_window_fg},bold,bg=default,underscore] \
#{?#{==:#{window_index},1},a,\
#{?#{==:#{window_index},2},s,\
#{?#{==:#{window_index},3},d,\
#{?#{==:#{window_index},4},f,\
#{?#{==:#{window_index},5},g,\
#{?#{==:#{window_index},6},h,\
#{?#{==:#{window_index},7},j,\
#{window_index}}}}}}}} :#{pane_current_command}"
#{window_index}}}}}}}} :#{window_name}"

set -g window-status-last-style "fg=${default_fg},bg=default"

set -g message-style "bg=default,fg=${default_fg}"
set -g message-command-style "bg=default,fg=${default_fg}"
set -g mode-style "bg=${session_selection_bg},fg=${session_selection_fg}"

########## PANES ##########
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-active-border-style "fg=${active_pane_border},bg=default"
set -g pane-border-style "fg=${inactive_pane_border},bg=default"
set -g pane-border-format "#{?pane_active,#[fg=${session_selection_fg},bg=${active_pane_border},bold] ACTIVE ,#[fg=${default_fg},bg=${inactive_pane_border}] #{pane_index} }"
set -g window-active-style "fg=${default_fg},bg=default"
set -g window-style "fg=#928374,bg=default"

# Window navigation without prefix via Cmd+asdfg in WezTerm.
bind -n C-M-a select-window -t 1
bind -n C-M-s select-window -t 2
bind -n C-M-d select-window -t 3
bind -n C-M-f select-window -t 4
bind -n C-M-g select-window -t 5

# Pane navigation without prefix via Cmd+hjkl in WezTerm.
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R
bind -T copy-mode-vi C-M-h select-pane -L
bind -T copy-mode-vi C-M-j select-pane -D
bind -T copy-mode-vi C-M-k select-pane -U
bind -T copy-mode-vi C-M-l select-pane -R

# Session switching shortcuts forwarded from WezTerm.
bind -n 'M-i' split-window -h -c "#{pane_current_path}"
bind -n 'M-u' split-window -v -c "#{pane_current_path}"
bind -n 'M-;' switch-client -l
bind -n 'M-w' copy-mode -e


########## CONTINUUM/RESURRECT ##########
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'



########## INIT TPM (MUSS GANZ UNTEN BLEIBEN) ##########
run '~/.tmux/plugins/tpm/tpm'


# immer Beam Cursor
set -g terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[5 q'

